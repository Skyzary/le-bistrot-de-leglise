on:
  push:
    branches:
      - develop # Change this if your main branch has a different name

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # or adjust to your pnpm version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear Next.js and OpenNext cache
        run: rm -rf .next .open-next

      - name: Build with OpenNext for Cloudflare
        run: pnpm exec opennextjs-cloudflare build

      - name: Patch worker.js to expose error
        run: |
          sed -i 's/async fetch(request, env, ctx) {/async fetch(request, env, ctx) { try {/' .open-next/worker.js
          sed -i 's/        });/        }); } catch(e) { return new Response(e.stack || e.message || String(e), { status: 500 }); }/' .open-next/worker.js

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview
          packageManager: pnpm
