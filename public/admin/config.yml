backend:
  name: git-gateway
  branch: main

locale: "fr"

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "Paramètres"
    files:
      - file: "src/content/theme.json"
        label: "Thème Saisonnier (Ambiance du Site)"
        name: "theme"
        fields:
          - label: "Mode d'ambiance du site"
            name: "mode"
            widget: "select"
            default: "halloween"
            hint: "Choisissez l'ambiance visuelle du site : Classique (toute l'année), Spécial Halloween 🎃 ou Fêtes de Noël 🎄."
            options:
              - { label: "Classique (Bistrot Traditionnel)", value: "classic" }
              - { label: "Spécial Halloween 🎃", value: "halloween" }
              - { label: "Fêtes de Noël & Hiver 🎄", value: "noel" }

      - file: "src/content/schedule.json"
        label: "Horaires d'Ouverture"
        name: "schedule"
        fields:
          - label: "Horaires"
            name: "items"
            widget: "list"
            summary: "{{fields.days}} : {{fields.time}}"
            fields:
              - { label: "Jours", name: "days", widget: "string" }
              - { label: "Heures", name: "time", widget: "string" }

      - file: "src/content/reviews.json"
        label: "Avis Clients"
        name: "reviews"
        fields:
          - label: "Note / Titre"
            name: "rating"
            widget: "string"
            default: "EXCELLENT"
          - label: "Nombre d'avis"
            name: "reviewCountText"
            widget: "string"
            default: "841 avis vérifiés"
          - label: "Liste des avis"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.content}}"
            fields:
              - { label: "Nom de l'auteur", name: "name", widget: "string" }
              - {
                  label: "Date ou Source",
                  name: "date",
                  widget: "string",
                  default: "Publié sur Google",
                }
              - {
                  label: "Initiale de l'avatar (ex: M)",
                  name: "initials",
                  widget: "string",
                  required: false,
                }
              - { label: "Contenu de l'avis", name: "content", widget: "text" }

      - file: "src/content/gallery.json"
        label: "Galerie Photos"
        name: "gallery"
        fields:
          - label: "Photos"
            name: "images"
            widget: "list"
            summary: "{{fields.title}} ({{fields.image}})"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Titre", name: "title", widget: "string", required: false }
              - { label: "Tag / Badge", name: "tag", widget: "string", required: false }
              - { label: "Description (histoire)", name: "desc", widget: "text", required: false }
              - {
                  label: "Description accessible (alt)",
                  name: "alt",
                  widget: "string",
                  required: false,
                }

      - file: "src/content/events.json"
        label: "Événements à venir"
        name: "events"
        fields:
          - label: "Événements"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}} ({{fields.time}})"
            fields:
              - { label: "Titre de l'événement", name: "title", widget: "string" }
              - { label: "Date (ex: Vendredi 14 Novembre)", name: "date", widget: "string" }
              - { label: "Heure (ex: À partir de 19h30)", name: "time", widget: "string" }
              - { label: "Tag / Catégorie (optionnel)", name: "tag", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Affiche / Image", name: "image", widget: "image", required: false }

      - file: "src/content/menu-preview.json"
        label: "Aperçu Menu (Page d'accueil)"
        name: "menu_preview"
        fields:
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Titre de la section"
                name: "title"
                widget: "string"
              - label: "Plats"
                name: "items"
                widget: "list"
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: "Nom du plat", name: "name", widget: "string" }
                  - { label: "Prix", name: "price", widget: "string" }
                  - {
                      label: "Description (optionnel)",
                      name: "desc",
                      widget: "string",
                      required: false,
                    }

      - file: "src/content/menu.json"
        label: "Carte Complète"
        name: "menu"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{fields.category}}"
            fields:
              - label: "Nom de la catégorie"
                name: "category"
                widget: "string"
              - label: "Description de la catégorie (optionnel)"
                name: "desc"
                widget: "text"
                required: false
              - label: "Plats"
                name: "items"
                widget: "list"
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: "Nom du plat", name: "name", widget: "string" }
                  - { label: "Prix", name: "price", widget: "string" }
                  - {
                      label: "Description (optionnel)",
                      name: "desc",
                      widget: "string",
                      required: false,
                    }
