backend:
  name: git-gateway
  branch: main


local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "Paramètres"
    files:
      - file: "src/content/schedule.json"
        label: "Horaires d'Ouverture"
        name: "schedule"
        fields:
          - label: "Horaires"
            name: "items"
            widget: "list"
            fields:
              - { label: "Jours", name: "days", widget: "string" }
              - { label: "Heures", name: "time", widget: "string" }

      - file: "src/content/reviews.json"
        label: "Avis Clients"
        name: "reviews"
        fields:
          - label: "Note / Titre"
            name: "rating"
            widget: "string"
            default: "EXCELLENT"
          - label: "Nombre d'avis"
            name: "reviewCountText"
            widget: "string"
            default: "841 avis vérifiés"
          - label: "Liste des avis"
            name: "items"
            widget: "list"
            fields:
              - { label: "Nom de l'auteur", name: "name", widget: "string" }
              - { label: "Date ou Source", name: "date", widget: "string", default: "Publié sur Google" }
              - { label: "Initiale de l'avatar (ex: M)", name: "initials", widget: "string", required: false }
              - { label: "Contenu de l'avis", name: "content", widget: "text" }

      - file: "src/content/menu-preview.json"
        label: "Aperçu Menu (Page d'accueil)"
        name: "menu_preview"
        fields:
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - label: "Titre de la section"
                name: "title"
                widget: "string"
              - label: "Plats"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Nom du plat", name: "name", widget: "string" }
                  - { label: "Prix", name: "price", widget: "string" }
                  - { label: "Description (optionnel)", name: "desc", widget: "string", required: false }

      - file: "src/content/menu.json"
        label: "Carte Complète"
        name: "menu"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            fields:
              - label: "Nom de la catégorie"
                name: "category"
                widget: "string"
              - label: "Description de la catégorie (optionnel)"
                name: "desc"
                widget: "text"
                required: false
              - label: "Plats"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Nom du plat", name: "name", widget: "string" }
                  - { label: "Prix", name: "price", widget: "string" }
                  - { label: "Description (optionnel)", name: "desc", widget: "string", required: false }
